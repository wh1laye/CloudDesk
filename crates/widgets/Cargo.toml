[package]
name = "clouddesk-widgets"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "clouddesk widget host"

[[bin]]
name = "clouddesk-widgets"
path = "src/main.rs"

[dependencies]
clouddesk-ui = { path = "../ui" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
