[package]
name = "clouddesk-installer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "clouddesk per-user installer"
build = "build.rs"

[dependencies]
clouddesk-ui = { path = "../ui" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
