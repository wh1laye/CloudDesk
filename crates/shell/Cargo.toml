[package]
name = "clouddesk-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "clouddesk"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = ["Foundation", "Media_Control", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem"] }
clouddesk-ui = { path = "../ui" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
