[package]
name = "clouddesk-launcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "clouddesk shell watchdog and recovery"

[[bin]]
name = "clouddesk-launcher"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
