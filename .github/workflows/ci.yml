name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: stage payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/payload | Out-Null
          foreach ($f in 'clouddesk', 'clouddesk-settings', 'clouddesk-launcher', 'clouddesk-widgets') {
            Copy-Item "target/release/$f.exe" dist/payload/
          }
          Copy-Item target/release/clouddesk-installer.exe dist/
          Copy-Item LICENSE, THIRD_PARTY.md dist/payload/
      - name: installer roundtrip
        shell: pwsh
        run: ./scripts/roundtrip.ps1 -Installer dist/clouddesk-installer.exe -Payload dist/payload
      - name: installer full mode roundtrip
        shell: pwsh
        run: ./scripts/roundtrip-full.ps1 -Installer dist/clouddesk-installer.exe -Payload dist/payload
      - uses: actions/upload-artifact@v4
        with:
          name: clouddesk
          path: dist
  supply-chain:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-tools-${{ runner.os }}-v1
      - run: rustup toolchain install stable --profile minimal
      - shell: pwsh
        run: |
          foreach ($t in 'cargo-deny', 'cargo-audit') {
            if (-not (Get-Command $t -ErrorAction SilentlyContinue)) { cargo install $t --locked }
          }
      - run: cargo deny check
      - run: cargo audit
