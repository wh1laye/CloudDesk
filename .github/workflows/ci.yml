name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: installer roundtrip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path target/release/clouddesk-installer.exe).Path
          $payload = Join-Path $env:RUNNER_TEMP 'payload'
          $dir = Join-Path $env:RUNNER_TEMP 'cd-install'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CloudDesk'
          New-Item -ItemType Directory -Force "$payload\sub" | Out-Null
          Set-Content "$payload\a.txt" 'a'
          Set-Content "$payload\sub\b.txt" 'b'
          if (Test-Path $key) { throw 'key exists before install' }
          & $exe install --silent --skip-checks --dir (Join-Path $env:RUNNER_TEMP 'missing') --payload (Join-Path $env:RUNNER_TEMP 'nope')
          if ($LASTEXITCODE -eq 0) { throw 'install with bad payload must fail' }
          & $exe install --silent --skip-checks --dir $dir --payload $payload
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          foreach ($f in 'a.txt', 'sub\b.txt', 'uninstall.exe', '.clouddesk-install') {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          if (-not (Test-Path $key)) { throw 'registry entry missing' }
          Set-Content "$payload\a.txt" 'a2'
          & $exe update --silent --skip-checks --dir $dir --payload $payload
          if ($LASTEXITCODE -ne 0) { throw 'update failed' }
          if ((Get-Content "$dir\a.txt") -ne 'a2') { throw 'update did not replace files' }
          if (Test-Path "$dir.bak") { throw 'backup left behind' }
          & "$dir\uninstall.exe" uninstall --silent --purge
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          for ($i = 0; $i -lt 40 -and ((Test-Path $dir) -or (Test-Path $key)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { throw 'install dir not removed' }
          if (Test-Path $key) { throw 'registry entry not removed' }
      - name: checksums
        shell: pwsh
        run: |
          Copy-Item target/release/clouddesk-installer.exe clouddesk-installer.exe
          (Get-FileHash clouddesk-installer.exe -Algorithm SHA256).Hash.ToLower() + '  clouddesk-installer.exe' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clouddesk-installer
          path: |
            clouddesk-installer.exe
            SHA256SUMS.txt
