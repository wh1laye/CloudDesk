name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo install cargo-deny cargo-audit --locked
      - run: cargo deny check
      - run: cargo audit
      - run: cargo build --release
      - name: stage payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/payload | Out-Null
          Copy-Item target/release/clouddesk.exe dist/payload/
          Copy-Item target/release/clouddesk-settings.exe dist/payload/
          Copy-Item target/release/clouddesk-launcher.exe dist/payload/
          Copy-Item target/release/clouddesk-widgets.exe dist/payload/
          Copy-Item target/release/clouddesk-installer.exe dist/
          Copy-Item LICENSE, THIRD_PARTY.md dist/payload/ -ErrorAction SilentlyContinue
      - name: installer roundtrip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path dist/clouddesk-installer.exe).Path
          $payload = (Resolve-Path dist/payload).Path
          $dir = Join-Path $env:RUNNER_TEMP 'cd-install'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CloudDesk'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if (Test-Path $key) { throw 'key exists before install' }
          & $exe install --silent --skip-checks --dir (Join-Path $env:RUNNER_TEMP 'missing') --payload (Join-Path $env:RUNNER_TEMP 'nope')
          if ($LASTEXITCODE -eq 0) { throw 'install with bad payload must fail' }
          & $exe install --silent --skip-checks --autostart --dir $dir --payload $payload
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          foreach ($f in 'clouddesk.exe', 'clouddesk-widgets.exe', 'clouddesk-settings.exe', 'uninstall.exe', '.clouddesk-install') {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          if (-not (Test-Path $key)) { throw 'registry entry missing' }
          if (-not (Get-ItemProperty -Path $run -Name CloudDesk -ErrorAction SilentlyContinue)) { throw 'autostart missing' }
          & $exe update --silent --skip-checks --dir $dir --payload $payload
          if ($LASTEXITCODE -ne 0) { throw 'update failed' }
          if (-not (Test-Path "$dir.bak\.clouddesk-install")) { throw 'backup missing after update' }
          & "$dir\uninstall.exe" uninstall --silent --purge
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          for ($i = 0; $i -lt 40 -and ((Test-Path $dir) -or (Test-Path $key)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { throw 'install dir not removed' }
          if (Test-Path "$dir.bak") { throw 'backup not removed' }
          if (Test-Path $key) { throw 'registry entry not removed' }
          if (Get-ItemProperty -Path $run -Name CloudDesk -ErrorAction SilentlyContinue) { throw 'autostart not removed' }
      - name: installer full mode roundtrip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path dist/clouddesk-installer.exe).Path
          $payload = (Resolve-Path dist/payload).Path
          $dir = Join-Path $env:RUNNER_TEMP 'cd-install-full'
          $wl = 'HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Winlogon'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CloudDesk'
          $backup = Join-Path $env:APPDATA 'CloudDesk\shell-backup.txt'
          $before = (Get-ItemProperty -Path $wl -Name Shell -ErrorAction SilentlyContinue).Shell
          $want = '"{0}\clouddesk-launcher.exe"' -f $dir
          & $exe install --silent --skip-checks --profile full --dir $dir --payload $payload
          if ($LASTEXITCODE -ne 0) { throw 'full install failed' }
          foreach ($f in 'clouddesk-launcher.exe', 'restore.cmd') {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          if (-not (Test-Path $backup)) { throw 'shell backup missing' }
          $now = (Get-ItemProperty -Path $wl -Name Shell -ErrorAction Stop).Shell
          if ($now -ne $want) { throw "shell value wrong: $now" }
          & $exe update --silent --skip-checks --dir $dir --payload $payload
          if ($LASTEXITCODE -ne 0) { throw 'full update failed' }
          $now = (Get-ItemProperty -Path $wl -Name Shell -ErrorAction Stop).Shell
          if ($now -ne $want) { throw "shell value lost on update: $now" }
          cmd /c "`"$dir\restore.cmd`""
          $mid = (Get-ItemProperty -Path $wl -Name Shell -ErrorAction SilentlyContinue).Shell
          if ($mid -ne $before) { throw 'restore.cmd did not restore shell' }
          & "$dir\uninstall.exe" uninstall --silent --purge
          if ($LASTEXITCODE -ne 0) { throw 'full uninstall failed' }
          for ($i = 0; $i -lt 40 -and ((Test-Path $dir) -or (Test-Path $key)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { throw 'install dir not removed' }
          if (Test-Path $key) { throw 'registry entry not removed' }
          $after = (Get-ItemProperty -Path $wl -Name Shell -ErrorAction SilentlyContinue).Shell
          if ($after -ne $before) { throw 'shell value not restored' }
          if (Test-Path $backup) { throw 'shell backup left behind' }
      - name: package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/clouddesk-installer.exe, dist/payload -DestinationPath clouddesk-portable.zip
          $h = Get-FileHash clouddesk-portable.zip -Algorithm SHA256
          $h.Hash.ToLower() + '  clouddesk-portable.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clouddesk
          path: |
            clouddesk-portable.zip
            SHA256SUMS.txt
